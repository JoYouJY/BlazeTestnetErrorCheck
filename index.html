<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonic Blaze Explorer</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Load Babel for JSX support in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Load Ethers.js v6 for Revert Reason Logic -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
    
    <!-- Custom Styles -->
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        /* Smooth scrolling for log lists */
        .overflow-y-auto { scrollbar-width: thin; }
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Application Logic Inline to avoid XHR/CORS issues -->
    <script type="text/babel">
        const { useState, useEffect, Component } = React;

        // --- Error Boundary ---
        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null, errorInfo: null };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }

            componentDidCatch(error, errorInfo) {
                console.error("Uncaught error:", error, errorInfo);
                this.setState({ errorInfo });
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-8 bg-red-50 text-red-900 min-h-screen font-sans">
                            <h1 className="text-2xl font-bold mb-4">Something went wrong</h1>
                            <div className="bg-white p-6 rounded-lg shadow border border-red-200">
                                <p className="font-semibold text-red-600 mb-2">{this.state.error?.toString()}</p>
                                <details className="text-xs font-mono text-slate-500 whitespace-pre-wrap">
                                    {this.state.errorInfo?.componentStack}
                                </details>
                            </div>
                            <button 
                                onClick={() => window.location.reload()} 
                                className="mt-6 px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 transition-colors"
                            >
                                Reload Page
                            </button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // --- Inline Icons ---
        const IconSearch = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        );
        const IconArrowLeft = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        );
        const IconClock = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        );
        const IconFileText = ({ size = 24, className }) => (
            <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        );
        const IconCheck = ({ size = 24, className }) => (
            <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        );
        const IconX = ({ size = 24, className }) => (
            <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        );
        const IconCopy = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        );
        const IconBox = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        );
        const IconWallet = ({ size = 24, className }) => (
            <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H4z"/></svg>
        );
        const IconActivity = ({ size = 24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        );
        const IconRefreshCw = ({ size = 24, className }) => (
            <svg width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        );

        // --- Config ---
        const RPC_URL = "https://rpc.blaze.soniclabs.com";
        const CHAIN_ID = 57054;
        const CURRENCY_SYMBOL = "S"; 

        // --- Main Component ---
        function SonicExplorer() {
            const [searchInput, setSearchInput] = useState('');
            const [view, setView] = useState('home'); 
            const [txTab, setTxTab] = useState('overview'); 
            
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [txData, setTxData] = useState(null);
            const [receiptData, setReceiptData] = useState(null);
            const [blockData, setBlockData] = useState(null);
            const [revertReason, setRevertReason] = useState(null);
            
            const [addressData, setAddressData] = useState(null); 
            const [addressTxs, setAddressTxs] = useState([]);
            const [scanning, setScanning] = useState(false);
            const [scanProgress, setScanProgress] = useState(null); 
            const [oldestScannedBlock, setOldestScannedBlock] = useState(0);
            const [latestBlockNum, setLatestBlockNum] = useState(0);

            const [dateStart, setDateStart] = useState('');
            const [dateEnd, setDateEnd] = useState('');
            const [isLocating, setIsLocating] = useState(false);

            const [blockStartInput, setBlockStartInput] = useState('');
            const [blockEndInput, setBlockEndInput] = useState('');

            const [modalConfig, setModalConfig] = useState(null); 
            const [isCopied, setIsCopied] = useState('');

            // --- RPC Helper (Single) ---
            const rpcCall = async (method, params) => {
                try {
                    const response = await fetch(RPC_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            jsonrpc: '2.0',
                            id: 1,
                            method: method,
                            params: params
                        })
                    });
                    const data = await response.json();
                    if (data.error) throw new Error(data.error.message);
                    return data.result;
                } catch(err) {
                    throw err;
                }
            };

            // --- RPC Helper (Batch) ---
            const rpcBatchCall = async (calls) => {
                const payload = calls.map((call, index) => ({
                    jsonrpc: '2.0',
                    id: index,
                    method: call.method,
                    params: call.params
                }));

                try {
                    const response = await fetch(RPC_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();
                    
                    if (!Array.isArray(data)) {
                        console.error("RPC Batch Error", data);
                        return [];
                    }
                    return data.sort((a, b) => a.id - b.id).map(d => d.result);
                } catch(err) {
                    console.error(err);
                    return [];
                }
            };

            const handleSearch = async (e) => {
                if (e) e.preventDefault();
                if (!searchInput) return;

                const input = searchInput.trim();
                setError(null);
                setLoading(true);

                try {
                    if (input.length === 66 && input.startsWith('0x')) {
                        await fetchTransaction(input);
                    } else if (input.length === 42 && input.startsWith('0x')) {
                        await fetchAddress(input);
                    } else {
                        setError("Invalid input. Please enter a valid Tx Hash (66 chars) or Address (42 chars).");
                        setLoading(false);
                    }
                } catch (err) {
                    setError(err.message || "An error occurred");
                    setLoading(false);
                }
            };

             const fetchTransaction = async (hash) => {
                setView('transaction');
                setTxTab('overview');
                setLoading(true);
                setTxData(null);
                setReceiptData(null);
                setBlockData(null);
                setRevertReason(null);

                try {
                    const tx = await rpcCall('eth_getTransactionByHash', [hash]);
                    if (!tx) throw new Error('Transaction not found.');
                    setTxData(tx);

                    const receipt = await rpcCall('eth_getTransactionReceipt', [hash]);
                    setReceiptData(receipt);

                    if (tx.blockNumber) {
                        const block = await rpcCall('eth_getBlockByNumber', [tx.blockNumber, false]);
                        setBlockData(block);
                    }

                    // --- Revert Reason Logic ---
                    if (receipt && receipt.status === '0x0') {
                        try {
                            const provider = new ethers.JsonRpcProvider(RPC_URL);
                            await provider.call({
                                to: tx.to,
                                from: tx.from,
                                data: tx.input || tx.data,
                                value: tx.value,
                                gasLimit: tx.gas,
                                gasPrice: tx.gasPrice
                            }, receipt.blockNumber);
                        } catch (err) {
                            console.log("Extraction error details:", err);
                            // ethers v6 extracts human-readable reason into err.reason if available
                            let reason = err.reason || err.message;
                            
                            // Clean up common prefixes
                            if (reason.includes("execution reverted:")) {
                                reason = reason.split("execution reverted:")[1].trim();
                            }
                            
                            // Handle raw hex if no human-readable reason
                            if (!err.reason && err.data && err.data.startsWith('0x')) {
                                reason = `Raw Error Data: ${err.data}`;
                            }

                            setRevertReason(reason);
                        }
                    }
                } catch (err) {
                    setError(err.message || "Error fetching transaction.");
                } finally {
                    setLoading(false);
                }
            };

            const fetchAddress = async (address) => {
                setView('address');
                setLoading(true);
                setAddressData(null);
                setAddressTxs([]);
                setScanning(true);
                setScanProgress(null);
                setLatestBlockNum(0);
                setBlockStartInput('');
                setBlockEndInput('');
                setDateStart('');
                setDateEnd('');

                try {
                    const [balanceHex, countHex, latestBlockHex] = await rpcBatchCall([
                        { method: 'eth_getBalance', params: [address, 'latest'] },
                        { method: 'eth_getTransactionCount', params: [address, 'latest'] },
                        { method: 'eth_blockNumber', params: [] }
                    ]);
                    
                    setAddressData({
                        address: address,
                        balance: balanceHex,
                        count: countHex
                    });

                    const latestBlock = parseInt(latestBlockHex, 16);
                    setLatestBlockNum(latestBlock);
                    
                    await scanBlocks(latestBlock, 100, address);

                } catch (err) {
                    setError(err.message || "Error fetching address data.");
                    setScanning(false);
                } finally {
                    setLoading(false);
                }
            };

            const findBlockByTimestamp = async (targetTimestamp) => {
                let start = 0;
                let end = latestBlockNum;
                let resultBlock = latestBlockNum;

                while (start <= end) {
                    const mid = Math.floor((start + end) / 2);
                    const block = await rpcCall('eth_getBlockByNumber', [`0x${mid.toString(16)}`, false]);
                    const ts = parseInt(block.timestamp, 16);

                    if (ts >= targetTimestamp) {
                        resultBlock = mid;
                        end = mid - 1;
                    } else {
                        start = mid + 1;
                    }
                }
                return resultBlock;
            };

            const handleDateScan = async (e) => {
                e.preventDefault();
                if (!dateStart || !dateEnd || !addressData) return;
                
                setIsLocating(true);
                setScanning(true);
                setError(null);

                try {
                    const startTs = Math.floor(new Date(dateStart).getTime() / 1000);
                    const endTs = Math.floor(new Date(dateEnd).getTime() / 1000);

                    if (startTs > endTs) throw new Error("Start date must be before end date.");

                    setScanProgress("Locating start block...");
                    const startBlockNum = await findBlockByTimestamp(startTs);
                    
                    setScanProgress("Locating end block...");
                    const endBlockNum = await findBlockByTimestamp(endTs);
                    
                    const blockCount = endBlockNum - startBlockNum;

                    if (blockCount <= 0) throw new Error("No blocks found in this time range.");
                    
                    const performScan = async () => {
                        setIsLocating(false);
                        setModalConfig(null);
                        await scanBlocks(endBlockNum, blockCount, addressData.address);
                    };

                    if (blockCount > 2000) {
                        setModalConfig({
                            message: `This date range covers ${blockCount} blocks. Scanning more than 2,000 blocks may take some time.`,
                            onConfirm: performScan,
                            onCancel: () => {
                                setIsLocating(false);
                                setScanning(false);
                                setScanProgress(null);
                                setModalConfig(null);
                            }
                        });
                    } else {
                        await performScan();
                    }

                } catch (err) {
                    setError(err.message || "Date scan failed");
                    setIsLocating(false);
                    setScanning(false);
                }
            };

            const handleBlockScan = async (e) => {
                e.preventDefault();
                if (!blockStartInput || !blockEndInput || !addressData) return;

                const start = parseInt(blockStartInput);
                const end = parseInt(blockEndInput);

                if (isNaN(start) || isNaN(end)) {
                    setError("Please enter valid block numbers.");
                    return;
                }
                if (start > end) {
                    setError("Start block must be less than or equal to End block.");
                    return;
                }

                const count = end - start + 1;
                const performScan = async () => {
                    setModalConfig(null);
                    await scanBlocks(end, count, addressData.address);
                };

                if (count > 2000) {
                        setModalConfig({
                        message: `You are requesting to scan ${count} blocks. This exceeds the recommended 2,000 block limit.`,
                        onConfirm: performScan,
                        onCancel: () => {
                            setModalConfig(null);
                            setScanning(false);
                        }
                    });
                } else {
                    await performScan();
                }
            };

            const scanBlocks = async (startBlock, count, address) => {
                setScanning(true);
                const BATCH_SIZE = 50; 
                const addrLower = address.toLowerCase();
                let foundTxs = [];
                
                try {
                    for (let i = 0; i < count; i += BATCH_SIZE) {
                        const currentBatchSize = Math.min(BATCH_SIZE, count - i);
                        const batchCalls = [];
                        
                        for (let j = 0; j < currentBatchSize; j++) {
                            const blockNum = startBlock - (i + j);
                            if (blockNum < 0) break;
                            batchCalls.push({ 
                                method: 'eth_getBlockByNumber', 
                                params: [`0x${blockNum.toString(16)}`, true] 
                            });
                        }
                        
                        if (batchCalls.length === 0) break;

                        setScanProgress(`${i} / ${count} blocks scanned`);
                        const blocks = await rpcBatchCall(batchCalls);
                        
                        blocks.forEach(block => {
                            if (block && block.transactions) {
                                block.transactions.forEach(tx => {
                                    if (
                                        (tx.from && tx.from.toLowerCase() === addrLower) || 
                                        (tx.to && tx.to.toLowerCase() === addrLower)
                                    ) {
                                        foundTxs.push({ ...tx, timestamp: block.timestamp });
                                    }
                                });
                            }
                        });

                        await new Promise(r => setTimeout(r, 10));
                    }

                    setAddressTxs(prev => {
                        const combined = [...prev, ...foundTxs];
                        const unique = Array.from(new Map(combined.map(item => [item.hash, item])).values());
                        return unique.sort((a, b) => parseInt(b.blockNumber, 16) - parseInt(a.blockNumber, 16));
                    });

                    setOldestScannedBlock(startBlock - count);
                } catch (err) {
                    console.error("Scan error:", err);
                } finally {
                    setScanning(false);
                    setScanProgress(null);
                }
            };

            const handleScanMore = () => {
                if (!addressData || oldestScannedBlock <= 0) return;
                scanBlocks(oldestScannedBlock, 1000, addressData.address);
            };

            // --- Utilities (Robust) ---
            const formatWei = (hexWei) => {
                if (!hexWei) return '0';
                if (typeof BigInt === 'undefined') return '0';
                try {
                    const bigIntWei = BigInt(hexWei);
                    const divisor = BigInt("1000000000000000000");
                    const integerPart = bigIntWei / divisor;
                    const remainder = bigIntWei % divisor;
                    let decimalPart = remainder.toString().padStart(18, '0');
                    decimalPart = decimalPart.replace(/0+$/, '');
                    if (decimalPart === '') return integerPart.toString();
                    return `${integerPart}.${decimalPart.slice(0, 4)}`;
                } catch (e) { return '0'; }
            };

            const formatGasPrice = (hexWei) => {
                if (!hexWei) return '0';
                if (typeof BigInt === 'undefined') return '0';
                try {
                    const bigIntWei = BigInt(hexWei);
                    const gweiDivisor = BigInt("1000000000");
                    const gwei = bigIntWei / gweiDivisor;
                    return gwei.toString();
                } catch(e) { return '0'; }
            };

            const formatGasPriceInS = (hexWei) => {
                if (!hexWei) return '0';
                if (typeof BigInt === 'undefined') return '0';
                try {
                    const bigIntWei = BigInt(hexWei);
                    const divisor = BigInt("1000000000000000000");
                    const integerPart = bigIntWei / divisor;
                    const remainder = bigIntWei % divisor;
                    let decimalPart = remainder.toString().padStart(18, '0').slice(0, 9);
                    return `${integerPart}.${decimalPart}`;
                } catch(e) { return '0'; }
            };

            const formatNumberWithCommas = (num) => {
                if (num === null || num === undefined) return '0';
                return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
            };

            const formatInputData = (input) => {
                if (!input || input === '0x' || input === '0x0') return null;
                return input;
            };

            // USD price placeholder (no live price feed - shows $0.00 as per example)
            const formatUSDValue = (sAmount) => {
                const parsed = parseFloat(sAmount);
                if (isNaN(parsed) || parsed === 0) return '$0.00';
                // Approximate: in real usage you'd fetch S price; placeholder shows minimal value
                return `$${(parsed * 0.042).toFixed(6)}`;
            };

            const hexToInt = (hex) => hex ? parseInt(hex, 16) : 0;

            const copyToClipboard = (text, label) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    setIsCopied(label);
                    setTimeout(() => setIsCopied(''), 2000);
                } catch (err) { }
                document.body.removeChild(textArea);
            };

            const calculateFee = (gasUsedHex, gasPriceHex) => {
                if (!gasUsedHex || !gasPriceHex) return '0';
                if (typeof BigInt === 'undefined') return '0';
                try {
                    const used = BigInt(gasUsedHex);
                    const price = BigInt(gasPriceHex);
                    const feeWei = used * price;
                    const divisor = BigInt("1000000000000000000");
                    const integerPart = feeWei / divisor;
                    const remainder = feeWei % divisor;
                    let decimalPart = remainder.toString().padStart(18, '0').slice(0, 8);
                    return `${integerPart}.${decimalPart}`;
                } catch(e) { return '0'; }
            };

            const timeAgo = (timestampHex) => {
                if (!timestampHex) return '';
                try {
                    const timestamp = parseInt(timestampHex, 16) * 1000;
                    const now = Date.now();
                    const diff = now - timestamp;
                    const seconds = Math.floor(diff / 1000);
                    const minutes = Math.floor(seconds / 60);
                    if (minutes > 60) return `${Math.floor(minutes/60)} hrs ago`;
                    if (minutes > 0) return `${minutes} mins ago`;
                    return `${seconds} secs ago`;
                } catch { return ''; }
            };

            const formatLocalTime = (timestampHex) => {
                if (!timestampHex) return 'Loading...';
                try {
                    return new Date(parseInt(timestampHex, 16) * 1000).toLocaleString();
                } catch { return ''; }
            };

            const goToTx = (hash) => {
                setSearchInput(hash);
                fetchTransaction(hash);
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 font-sans p-4 md:p-8">
                    {/* Navbar */}
                    <div className="max-w-7xl mx-auto mb-8 flex flex-col md:flex-row items-center justify-between">
                        <div className="flex items-center gap-3 mb-4 md:mb-0 cursor-pointer" onClick={() => { setView('home'); setSearchInput(''); }}>
                            <div className="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-xl shadow-lg">
                                S
                            </div>
                            <h1 className="text-2xl font-bold text-slate-800">SonicScan <span className="text-xs bg-slate-200 text-slate-600 px-2 py-1 rounded-full font-normal ml-2">Blaze</span></h1>
                        </div>
                        
                        {view !== 'home' && (
                        <form onSubmit={handleSearch} className="relative w-full md:w-96">
                            <input 
                                type="text" 
                                placeholder="Search by Tx Hash / Address" 
                                className="w-full pl-4 pr-10 py-2 rounded-full border border-slate-200 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 text-sm font-mono shadow-sm"
                                value={searchInput}
                                onChange={(e) => setSearchInput(e.target.value)}
                            />
                            <button type="submit" className="absolute right-3 top-2 text-indigo-600"><IconSearch size={16} /></button>
                        </form>
                        )}
                    </div>

                    {view === 'home' && (
                        <div className="flex flex-col items-center justify-center pt-20">
                        <div className="w-20 h-20 bg-indigo-600 rounded-2xl flex items-center justify-center text-white font-bold text-4xl shadow-2xl mb-8 transform rotate-3">S</div>
                        <h2 className="text-3xl md:text-5xl font-bold text-slate-800 mb-4 text-center">Sonic Blaze Explorer</h2>
                        <p className="text-slate-500 mb-12 text-center max-w-lg">Explore blocks, transactions, and wallet activity on the high-performance Sonic Blaze Testnet.</p>
                        
                        <div className="w-full max-w-2xl px-4">
                            <form onSubmit={handleSearch} className="relative group">
                                <input 
                                    type="text" 
                                    placeholder="Search by Tx Hash (0x...) or Address (0x...)"

                        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-2xl max-w-md w-full p-6">
                                <h3 className="text-lg font-bold text-slate-800 mb-2">High Volume Scan</h3>
                                <p className="text-slate-600 text-sm mb-6">{modalConfig.message}</p>
                                <div className="flex justify-end gap-3">
                                    <button onClick={modalConfig.onCancel} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg text-sm">Cancel</button>
                                    <button onClick={modalConfig.onConfirm} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm">Continue</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- Render Application ---
        const App = () => (
            <ErrorBoundary>
                <SonicExplorer />
            </ErrorBoundary>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
